openapi: 3.0.3

info:
  title: notificaciones-ms
  version: 1.0.0-SNAPSHOT
  description: Contrato OpenAPI del microservicio de notificaciones. Es la fuente de verdad de la API.

servers:
  - url: /

tags:
  - name: Notificaciones
    description: Envio y consulta de notificaciones

paths:

  /notificaciones:
    get:
      tags: [Notificaciones]
      operationId: getAllNotificaciones
      summary: Lista todas las notificaciones
      responses:
        '200':
          description: Lista de notificaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notificacion'
    post:
      tags: [Notificaciones]
      operationId: createNotificacion
      summary: Registra y envia una notificacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notificacion'
      responses:
        '201':
          description: Notificacion registrada. El estado final (ENVIADO o FALLIDO) lo asigna el servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '400':
          description: Faltan campos obligatorios

  /notificaciones/{id}:
    get:
      tags: [Notificaciones]
      operationId: getNotificacion
      summary: Obtiene una notificacion por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Notificacion encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '404':
          description: Notificacion no encontrada

components:
  schemas:

    Notificacion:
      type: object
      description: Notificacion gestionada por el servicio, con su estado de envio.
      required:
        - destinatario
        - asunto
        - cuerpo
      properties:
        id:
          type: integer
          format: int64
          description: Lo asigna el servidor. Se ignora si llega en la peticion.
        destinatario:
          type: string
          maxLength: 200
        asunto:
          type: string
          maxLength: 200
        cuerpo:
          type: string
          maxLength: 2000
        estado:
          type: string
          enum: [PENDIENTE, ENVIADO, FALLIDO]
          description: Estado del envio, asignado por el servidor. El cliente no lo envia.
        motivoFallo:
          type: string
          maxLength: 500
          description: Motivo del fallo, solo presente cuando estado es FALLIDO.
